<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Quem está assistindo?</h1>
    </header>
    <main>
        <section aria-label="Seleção de perfil" class="profile-section">
            <ul class="profile-container">
                <li class="profile">
                    <figure>
                        <img src="assets/PirloProfile.png" alt="Foto de perfil de João">
                        <figcaption>Pirlo</figcaption>
                    </figure>
                </li>
                <li class="profile">
                    <figure>
                        <img src="assets/R10Profile.png" alt="Foto de perfil de Maria">
                        <figcaption>R10</figcaption>
                    </figure>
                </li>
                <li class="profile">
                    <figure>
                        <img src="assets/BuffonProfile.png" alt="Foto de perfil de Carlos">
                        <figcaption>Buffon</figcaption>
                    </figure>
                </li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 FakeFlix. Todos os direitos reservados.</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
